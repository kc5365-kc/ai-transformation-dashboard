<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AI Transformation Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F4F6F9;
    --surface:#FFFFFF;
    --surface-2:#FBFCFD;
    --ink:#10203A;
    --muted:#5B6B82;
    --faint:#8A97A9;
    --line:#E2E7EE;
    --line-strong:#CDD5E0;
    --primary:#2F4BB5;
    --primary-soft:#EAEEFB;
    --teal:#11A08A;
    --teal-soft:#E0F4F0;
    --amber:#E8903A;
    --amber-soft:#FBEBD6;
    --coral:#E5564E;
    --coral-soft:#FBE6E4;
    --violet:#6C5CE0;
    --green:#2FA866;
    --display:'Archivo',system-ui,sans-serif;
    --body:'Inter',system-ui,sans-serif;
    --mono:'JetBrains Mono',ui-monospace,monospace;
    --shadow:0 1px 2px rgba(16,32,58,.05), 0 10px 30px -18px rgba(16,32,58,.25);
    --radius:12px;
    --sidebar:230px;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);
    font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
  h1,h2,h3,h4{font-family:var(--display);margin:0;letter-spacing:-.01em}
  button{font-family:var(--body);cursor:pointer}
  input,select{font-family:var(--body);font-size:13px}
  .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

  /* ---------------- layout ---------------- */
  .app{display:grid;grid-template-columns:var(--sidebar) 1fr;min-height:100vh}

  .side{position:sticky;top:0;height:100vh;background:var(--surface);border-right:1px solid var(--line);
    display:flex;flex-direction:column;padding:20px 16px;gap:4px;overflow-y:auto}
  .side .logo{display:flex;align-items:center;gap:10px;padding:4px 6px 16px}
  .side .logo svg{width:28px;height:28px;flex:none}
  .side .logo .t{font-family:var(--display);font-weight:700;font-size:14px;line-height:1.15}
  .side .logo .s{font-size:11px;color:var(--faint)}
  .navlabel{font-size:11px;color:var(--faint);font-weight:600;padding:14px 8px 6px;letter-spacing:.02em}
  .navitem{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:none;background:none;
    color:var(--muted);font-weight:500;font-size:13.5px;padding:9px 10px;border-radius:9px;transition:background .15s,color .15s}
  .navitem:hover{background:var(--paper);color:var(--ink)}
  .navitem[aria-current="true"]{background:var(--primary-soft);color:var(--primary);font-weight:600}
  .navitem .dot{width:7px;height:7px;border-radius:2px;background:currentColor;opacity:.75}
  .side .spacer{flex:1}
  .side .field{padding:6px}
  .side .field label{display:block;font-size:11px;color:var(--faint);font-weight:600;margin-bottom:5px}
  .side select.teamsel{width:100%;padding:8px 9px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);color:var(--ink)}
  .side .actions{display:flex;flex-direction:column;gap:6px;padding:6px;border-top:1px solid var(--line);margin-top:8px}

  .btn{border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);
    padding:8px 12px;border-radius:9px;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:7px;justify-content:center}
  .btn:hover{border-color:var(--primary);color:var(--primary)}
  .btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
  .btn.primary:hover{background:#263c93;color:#fff}
  .btn.small{padding:6px 10px;font-size:12px}
  .btn.ghost{border-color:transparent;background:var(--paper)}
  .btn.danger:hover{border-color:var(--coral);color:var(--coral)}

  .main{min-width:0;padding:26px 30px 70px;max-width:1180px}

  /* ---------------- top meta ---------------- */
  .topmeta{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:22px}
  .topmeta .org h2{font-size:21px;font-weight:700}
  .topmeta .org .per{color:var(--muted);font-size:13px;margin-top:3px}
  .indexbox{display:flex;align-items:center;gap:16px;background:var(--surface);border:1px solid var(--line);
    border-radius:var(--radius);padding:12px 16px;box-shadow:var(--shadow)}
  .indexbox .ring{position:relative}
  .indexbox .ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .indexbox .ring .c .v{font-family:var(--mono);font-weight:600;font-size:19px;line-height:1}
  .indexbox .ring .c .l{font-size:9px;color:var(--faint)}
  .indexbox .meta .lab{font-size:12px;color:var(--muted)}
  .indexbox .meta .stage{font-family:var(--display);font-weight:700;font-size:16px;margin-top:2px}
  .indexbox .meta .trend{font-size:11.5px;color:var(--green);margin-top:3px;font-weight:500}

  .filterchip{display:inline-flex;align-items:center;gap:8px;background:var(--primary-soft);color:var(--primary);
    border-radius:999px;padding:6px 8px 6px 13px;font-size:12.5px;font-weight:600;margin-bottom:16px}
  .filterchip button{border:none;background:var(--primary);color:#fff;width:18px;height:18px;border-radius:50%;
    font-size:11px;line-height:1;display:grid;place-items:center}

  /* ---------------- stage ladder ---------------- */
  .ladder{display:flex;gap:6px;margin:0 0 24px}
  .rung{flex:1;position:relative}
  .rung .bar{height:7px;border-radius:4px;background:var(--line)}
  .rung.done .bar{background:var(--primary)}
  .rung.current .bar{background:var(--primary)}
  .rung.current .bar{box-shadow:0 0 0 3px var(--primary-soft)}
  .rung .lab{margin-top:9px;font-size:11.5px;color:var(--muted);font-weight:500}
  .rung .sub{font-size:10.5px;color:var(--faint);margin-top:1px}
  .rung.done .lab,.rung.current .lab{color:var(--ink)}
  .rung.current .lab{font-weight:700}
  .rung.current::after{content:"now";position:absolute;top:-19px;left:0;font-size:10px;font-weight:700;color:var(--primary);
    background:var(--primary-soft);padding:2px 7px;border-radius:5px}

  /* ---------------- north star meters ---------------- */
  .meters{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:10px}
  .meter{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 16px 15px}
  .meter .mh{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .meter .mname{font-size:12.5px;color:var(--muted);font-weight:500}
  .meter .mval{font-family:var(--mono);font-weight:600;font-size:26px;line-height:1;margin:10px 0 2px;letter-spacing:-.02em}
  .meter .mtrack{position:relative;height:8px;background:var(--paper);border:1px solid var(--line);border-radius:6px;margin:12px 0 0;overflow:visible}
  .meter .mfill{height:100%;border-radius:6px;width:0;transition:width 1.1s cubic-bezier(.2,.75,.25,1)}
  .meter .mtick{position:absolute;top:-4px;height:16px;width:2px;background:var(--amber);border-radius:2px}
  .meter .mfoot{display:flex;justify-content:space-between;margin-top:9px;font-size:11px;color:var(--faint)}
  .meter .mfoot b{font-family:var(--mono);font-weight:500;color:var(--amber)}
  .meter .mgap{font-family:var(--mono);font-weight:500}

  /* ---------------- sections ---------------- */
  .page{display:none}
  .page.active{display:block}
  .sec{margin-top:30px}
  .sec-h{display:flex;align-items:center;gap:12px;margin-bottom:13px}
  .sec-h h3{font-size:15px;font-weight:700}
  .sec-h .d{font-size:12.5px;color:var(--muted)}
  .sec-h .rule{flex:1;height:1px;background:var(--line)}

  .grid{display:grid;gap:14px}
  .c2{grid-template-columns:repeat(2,1fr)}
  .c3{grid-template-columns:repeat(3,1fr)}
  .c4{grid-template-columns:repeat(4,1fr)}
  .c21{grid-template-columns:1.6fr 1fr}
  .c12{grid-template-columns:1fr 1.6fr}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:17px}
  .card.raise{box-shadow:var(--shadow)}
  .card h4{font-size:13.5px;font-weight:700}
  .card .sub{font-size:11.5px;color:var(--muted);margin-top:2px;margin-bottom:14px}

  .stat .n{font-family:var(--mono);font-weight:600;font-size:27px;letter-spacing:-.02em;line-height:1}
  .stat .n small{font-size:14px;color:var(--faint);font-weight:500}
  .stat .cap{font-size:12px;color:var(--muted);margin-top:7px}
  .stat .chg{font-size:11.5px;margin-top:6px;font-weight:600}
  .chg.up{color:var(--green)} .chg.down{color:var(--coral)} .chg.flat{color:var(--faint)}
  .tinynote{font-size:11px;color:var(--faint);margin-top:9px;line-height:1.4}

  /* pillar cards */
  .pillar{position:relative;overflow:hidden}
  .pillar .pacc{position:absolute;left:0;top:0;bottom:0;width:4px}
  .pillar .pt{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:12px}
  .pillar .pt .nm{font-family:var(--display);font-weight:700;font-size:15px}
  .pillar .pt .sc{font-family:var(--mono);font-weight:600;font-size:30px;letter-spacing:-.03em}
  .pillar .pt .sc small{font-size:13px;color:var(--faint)}
  .pillar .pr{display:flex;justify-content:space-between;font-size:12px;padding:6px 0;border-top:1px solid var(--line)}
  .pillar .pr span:first-child{color:var(--muted)}
  .pillar .pr span:last-child{font-family:var(--mono)}

  /* bullet rows */
  .blt{margin:12px 0}
  .blt.click{cursor:pointer;border-radius:8px;padding:5px;margin:4px -5px;transition:background .15s}
  .blt.click:hover{background:var(--paper)}
  .blt .bt{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;margin-bottom:6px}
  .blt .bn{font-weight:500}
  .blt .bv{font-family:var(--mono);color:var(--muted);font-size:12px}
  .blt .bk{position:relative;height:8px;background:var(--paper);border:1px solid var(--line);border-radius:6px;overflow:visible}
  .blt .bf{height:100%;border-radius:6px;width:0;transition:width 1s cubic-bezier(.2,.75,.25,1)}
  .blt .bx{position:absolute;top:-4px;height:16px;width:2px;background:var(--amber);border-radius:2px}
  .blt.dim{opacity:.32}

  /* bars */
  .bars{display:flex;align-items:flex-end;gap:9px;height:150px;padding-top:20px}
  .bcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;height:100%;justify-content:flex-end;cursor:pointer}
  .bwrap{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center}
  .bar{width:60%;max-width:30px;border-radius:5px 5px 2px 2px;height:0;transition:height 1s cubic-bezier(.2,.75,.25,1);position:relative}
  .bar .bv{position:absolute;top:-17px;left:50%;transform:translateX(-50%);font-family:var(--mono);font-size:10.5px;color:var(--muted)}
  .bx-lab{font-size:10.5px;color:var(--faint);text-align:center;line-height:1.15}
  .bcol.dim{opacity:.3}
  .bcol.sel .bx-lab{color:var(--primary);font-weight:700}

  /* donut */
  .donutwrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
  .legend{display:flex;flex-direction:column;gap:8px;font-size:12px;min-width:150px}
  .legend .li{display:flex;align-items:center;gap:9px}
  .legend .sw{width:11px;height:11px;border-radius:3px;flex:none}
  .legend .ln{flex:1;color:var(--muted)}
  .legend .lv{font-family:var(--mono);color:var(--ink)}

  /* tables */
  .tw{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  thead th{font-family:var(--display);font-weight:600;text-align:left;color:var(--muted);font-size:11.5px;
    padding:9px 11px;border-bottom:1px solid var(--line-strong);white-space:nowrap}
  tbody td{padding:10px 11px;border-bottom:1px solid var(--line);vertical-align:middle}
  tbody tr:last-child td{border-bottom:none}
  tbody tr:hover{background:var(--surface-2)}
  td.num,th.num{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}
  .tnm{font-weight:600}
  .tsub{color:var(--faint);font-size:11px;margin-top:1px}

  .tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
  .tag::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
  .t-live{color:var(--teal);background:var(--teal-soft)}
  .t-build{color:var(--primary);background:var(--primary-soft)}
  .t-prio{color:var(--violet);background:#ECE9FB}
  .t-intake{color:var(--muted);background:var(--paper)}
  .t-hold{color:var(--amber);background:var(--amber-soft)}
  .t-low{color:var(--green);background:#E4F4EB}
  .t-med{color:var(--amber);background:var(--amber-soft)}
  .t-high{color:var(--coral);background:var(--coral-soft)}
  .rag{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;vertical-align:middle}
  .rag-g{background:var(--green)} .rag-a{background:var(--amber)} .rag-r{background:var(--coral)}

  /* funnel */
  .funnel .ft{display:flex;align-items:baseline;justify-content:space-between}
  .funnel .fn{font-family:var(--mono);font-weight:600;font-size:26px}
  .funnel .fl{font-size:12px;color:var(--muted)}
  .funnel .fbar{height:6px;border-radius:4px;margin-top:9px}

  /* chips */
  .chips{display:flex;flex-direction:column;gap:9px}
  .chips .row{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;
    padding:8px 11px;background:var(--paper);border-radius:8px}
  .chips .row b{font-family:var(--mono);font-weight:600}

  /* attention */
  .alist{display:flex;flex-direction:column}
  .arow{display:flex;gap:11px;padding:11px 0;border-bottom:1px solid var(--line)}
  .arow:last-child{border-bottom:none}
  .arow .at{font-size:13px;font-weight:600}
  .arow .ad{font-size:11.5px;color:var(--muted);margin-top:2px}

  /* leaderboard */
  .lb{display:flex;flex-direction:column}
  .lbr{display:grid;grid-template-columns:22px 1fr 140px;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
  .lbr:last-child{border-bottom:none}
  .lbr .rk{font-family:var(--mono);color:var(--faint);text-align:center;font-size:12px}
  .lbr .who{font-size:13px;font-weight:600}
  .lbr .who .wt{font-size:11px;color:var(--faint);font-weight:400}
  .lbr .mb{height:7px;background:var(--paper);border:1px solid var(--line);border-radius:5px;overflow:hidden}
  .lbr .mb i{display:block;height:100%;width:0;background:var(--primary);transition:width .9s cubic-bezier(.2,.75,.25,1)}
  .lbr .ml{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;color:var(--faint);margin-top:3px}

  /* team profile drill-down */
  .profile{background:linear-gradient(180deg,var(--primary-soft),var(--surface));border:1px solid var(--line-strong);
    border-radius:var(--radius);padding:18px;margin-bottom:22px;box-shadow:var(--shadow)}
  .profile .ph{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
  .profile .ph .nm{font-family:var(--display);font-weight:700;font-size:18px;color:var(--primary)}
  .profile .pg{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
  .profile .pm .v{font-family:var(--mono);font-weight:600;font-size:22px;letter-spacing:-.02em}
  .profile .pm .k{font-size:11px;color:var(--muted);margin-top:3px}
  .profile .plists{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
  .profile .plists h5{font-family:var(--display);font-size:12px;margin:0 0 7px;color:var(--muted)}
  .profile .plists .it{font-size:12.5px;padding:5px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:10px}

  /* ---------------- edit mode ---------------- */
  .editbar{position:sticky;bottom:0;z-index:20;margin:26px -30px -70px;padding:14px 30px;
    background:var(--surface);border-top:1px solid var(--line-strong);display:flex;align-items:center;gap:12px;
    box-shadow:0 -10px 30px -22px rgba(16,32,58,.5)}
  .editbar .msg{font-size:12.5px;color:var(--muted);flex:1}
  .editbanner{background:var(--amber-soft);border:1px solid var(--amber);color:#8a5713;border-radius:10px;
    padding:11px 14px;font-size:12.5px;margin-bottom:20px;display:flex;gap:9px;align-items:flex-start}
  .ecard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px}
  .ecard > h4{font-size:13.5px;font-weight:700;margin-bottom:3px}
  .ecard > .sub{font-size:11.5px;color:var(--muted);margin-bottom:13px}
  .egrid{display:grid;gap:10px 14px}
  .fld{display:flex;flex-direction:column;gap:4px}
  .fld label{font-size:11px;color:var(--muted);font-weight:600}
  .inp{width:100%;padding:7px 9px;border:1px solid var(--line-strong);border-radius:7px;background:var(--surface);color:var(--ink)}
  .inp:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
  .etable{width:100%;border-collapse:collapse;font-size:12px}
  .etable th{text-align:left;font-size:10.5px;color:var(--faint);font-weight:600;padding:4px 6px}
  .etable td{padding:3px 6px}
  .etable .inp{padding:6px 7px;font-size:12px}
  .rowdel{border:1px solid var(--line-strong);background:var(--surface);color:var(--coral);width:26px;height:26px;border-radius:6px;font-size:14px;line-height:1}
  .rowdel:hover{border-color:var(--coral)}
  .addrow{margin-top:10px}

  .footer{margin-top:40px;padding-top:18px;border-top:1px solid var(--line);color:var(--faint);font-size:11.5px;line-height:1.6}
  .footer b{color:var(--muted)}

  /* mobile */
  .menutoggle{display:none}
  @media(max-width:980px){
    .meters{grid-template-columns:repeat(2,1fr)}
    .c3,.c4{grid-template-columns:repeat(2,1fr)}
    .c21,.c12{grid-template-columns:1fr}
    .profile .pg{grid-template-columns:repeat(3,1fr)}
  }
  @media(max-width:760px){
    .app{grid-template-columns:1fr}
    .side{position:fixed;left:0;top:0;bottom:0;width:250px;z-index:50;transform:translateX(-100%);transition:transform .22s}
    .side.open{transform:none}
    .main{padding:18px 16px 70px}
    .menutoggle{display:inline-flex;position:fixed;top:12px;right:12px;z-index:40;background:var(--surface);
      border:1px solid var(--line-strong);border-radius:9px;padding:9px 11px;box-shadow:var(--shadow)}
    .meters,.c2{grid-template-columns:1fr}
    .ladder{flex-wrap:wrap}
    .rung{flex:1 1 40%}
    .profile .pg{grid-template-columns:repeat(2,1fr)}
    .profile .plists{grid-template-columns:1fr}
    .lbr{grid-template-columns:20px 1fr 110px}
    .editbar{margin:26px -16px -70px;padding:12px 16px;flex-wrap:wrap}
  }
  @media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto}}
  :focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:5px}
</style>
</head>
<body>

<button class="menutoggle" id="menuToggle" aria-label="Menu">☰</button>

<div class="app">
  <!-- ============ SIDEBAR ============ -->
  <aside class="side" id="side">
    <div class="logo">
      <svg viewBox="0 0 32 32" fill="none">
        <rect x="2" y="2" width="28" height="28" rx="8" fill="#2F4BB5"/>
        <path d="M8 21 L13 13 L18 18 L24 9" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="24" cy="9" r="2.4" fill="#E8903A"/>
      </svg>
      <div>
        <div class="t">AI Transformation</div>
        <div class="s">Head of AI</div>
      </div>
    </div>

    <div class="navlabel">Pillars</div>
    <button class="navitem" data-page="overview" aria-current="true"><span class="dot"></span>Overview</button>
    <button class="navitem" data-page="technology"><span class="dot"></span>Technology</button>
    <button class="navitem" data-page="process"><span class="dot"></span>Process</button>
    <button class="navitem" data-page="people"><span class="dot"></span>People</button>

    <div class="spacer"></div>

    <div class="field">
      <label for="teamSel">Filter by team</label>
      <select class="teamsel" id="teamSel"></select>
    </div>

    <div class="actions">
      <button class="btn primary small" id="editBtn">Edit data</button>
      <button class="btn small" id="exportBtn">Export JSON</button>
      <button class="btn small" id="importBtn">Import JSON</button>
      <button class="btn small" id="bakeBtn">Download with data</button>
      <input type="file" id="importFile" accept="application/json" hidden>
    </div>

function ringSVG(pct,size=54){
  const r=(size-8)/2, c=2*Math.PI*r, off=c*(1-pct/100);
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${cssv('--line')}" stroke-width="5"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${cssv('--primary')}" stroke-width="5"
      stroke-linecap="round" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"
      transform="rotate(-90 ${size/2} ${size/2})"/></svg>`;
}
function sparkArea(data,w=520,h=96){
  const pad=8, max=Math.max(...data)*1.1, min=0, step=(w-pad*2)/(data.length-1);
  const pts=data.map((d,i)=>[pad+i*step, h-pad-((d-min)/(max-min))*(h-pad*2)]);
  const line=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  const area=line+` L${pts.at(-1)[0].toFixed(1)} ${h-pad} L${pad} ${h-pad} Z`;
  const tY=h-pad-((80-min)/(max-min))*(h-pad*2), last=pts.at(-1);
  return `<svg width="100%" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <defs><linearGradient id="spg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="${cssv('--teal')}" stop-opacity=".22"/>
      <stop offset="1" stop-color="${cssv('--teal')}" stop-opacity="0"/></linearGradient></defs>
    <line x1="${pad}" y1="${tY.toFixed(1)}" x2="${w-pad}" y2="${tY.toFixed(1)}" stroke="${cssv('--amber')}" stroke-dasharray="4 4" stroke-width="1"/>
    <text x="${w-pad}" y="${(tY-5).toFixed(1)}" text-anchor="end" font-family="${cssv('--mono')}" font-size="10" fill="${cssv('--amber')}">target 80%</text>
    <path d="${area}" fill="url(#spg)"/>
    <path d="${line}" fill="none" stroke="${cssv('--teal')}" stroke-width="2.4" stroke-linejoin="round"/>
    <circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="3.6" fill="${cssv('--teal')}"/></svg>`;
}
function donutSVG(items,total){
  const S=130,cx=S/2,cy=S/2,r=52,C=2*Math.PI*r; let off=0,segs="";
  items.forEach(it=>{ const len=it.v/total*C;
    segs+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${col(it.color)}" stroke-width="15"
      stroke-dasharray="${len.toFixed(2)} ${(C-len).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}"
      transform="rotate(-90 ${cx} ${cy})"/>`; off+=len; });
  return `<svg width="130" height="130" viewBox="0 0 ${S} ${S}">
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${cssv('--line')}" stroke-width="15"/>${segs}</svg>`;
}

    <div class="bk"><div class="bf" style="width:0;background:${col(color)}" data-w="${pct}"></div>${tick}</div></div>`;
}

function teamBars(metric){
  const list=DB.teams;
  const vals=list.map(t=>metric==="dau"?dau(t):metric==="aq"?t.aq:dau(t));
  const max=metric==="aq"?100:100;
  return `<div class="bars">${list.map((t,i)=>{
    const v=vals[i], h=v/max*100, sel=activeTeam===t.id, dim=activeTeam&&!sel;
    const c=v>=80?"--teal":v>=55?"--primary":"--amber";
    return `<div class="bcol ${sel?'sel':''} ${dim?'dim':''}" onclick="selectTeam('${t.id}')">
      <div class="bwrap"><div class="bar" style="background:${col(c)}" data-h="${h}"><span class="bv">${v}${metric==='aq'?'':'%'}</span></div></div>
      <div class="bx-lab">${esc(t.name)}</div></div>`;
  }).join("")}</div>`;
}
function buildBars(){

      <div class="bwrap" style="gap:3px;align-items:flex-end">
        <div class="bar" style="width:13px;background:${cssv('--teal')};height:0" data-h="${t.skills/max*100}"><span class="bv">${t.skills}</span></div>

function fld(label,path,type="text",opts){
  const v=getP(path);
  if(type==="select"){
    return `<div class="fld"><label>${label}</label><select class="inp" data-path="${path}">
      ${opts.map(o=>`<option value="${esc(o.v)}" ${String(v)===String(o.v)?"selected":""}>${esc(o.t)}</option>`).join("")}</select></div>`;
  }
  return `<div class="fld"><label>${label}</label>
    <input class="inp" data-path="${path}" data-num="${type==='number'?1:0}" type="${type==='number'?'number':'text'}"
      step="any" value="${esc(v==null?'':v)}"></div>`;
}
function editCard(title,sub,inner){return `<div class="ecard"><h4>${title}</h4><div class="sub">${sub}</div>${inner}</div>`;}

const stageOpts = [{v:"intake",t:"Intake"},{v:"prio",t:"Prioritized"},{v:"build",t:"In build"},{v:"live",t:"Live"},{v:"hold",t:"On hold"}];
const riskOpts = [{v:"low",t:"Low"},{v:"med",t:"Medium"},{v:"high",t:"High"}];

function eTable(cols, listPath, rowFields, addTemplate){
  const list=getP(listPath);
  const head=cols.map(c=>`<th>${c}</th>`).join("")+"<th></th>";
  const rows=list.map((_,i)=>{
    const cells=rowFields(i).map(f=>`<td>${f}</td>`).join("");
    return `<tr>${cells}<td><button class="rowdel" onclick="delRow('${listPath}',${i})" aria-label="Delete row">✕</button></td></tr>`;
  }).join("");
  return `<div class="tw"><table class="etable"><thead><tr>${head}</tr></thead><tbody>${rows}</tbody></table></div>
    <button class="btn small addrow" onclick='addRow("${listPath}", ${JSON.stringify(addTemplate)})'>+ Add row</button>`;
}
function ei(path,type="text",opts){ // edit input shorthand (no label) for tables
  const v=getP(path);
  if(type==="select") return `<select class="inp" data-path="${path}">${opts.map(o=>`<option value="${esc(o.v)}" ${String(v)===String(o.v)?"selected":""}>${esc(o.t)}</option>`).join("")}</select>`;
  return `<input class="inp" data-path="${path}" data-num="${type==='number'?1:0}" type="${type==='number'?'number':'text'}" step="any" value="${esc(v==null?'':v)}">`;
}

            ei(`champions.${i}.trained`,"number"),ei(`champions.${i}.skills`,"number"),ei(`champions.${i}.agents`,"number"),
            ei(`champions.${i}.impact`,"select",impactOpts)],
        {name:"New champion",team:DB.teams[0]?.name||"",sessions:0,trained:0,skills:0,agents:0,impact:"Growing"}));
    html+=`<div class="ecard"><h4 style="margin-bottom:3px">Note</h4><div class="sub" style="margin:0">Per-team adoption, SHIFT-AQ and skills/agents are driven by the <b>Teams</b> table on the Technology tab.</div></div>`;
  }
  $("#page-"+p).innerHTML=html;
  bindEditInputs();
}

function bindEditInputs(){
  document.querySelectorAll("#page-"+page+" .inp[data-path]").forEach(el=>{
    el.addEventListener("input",()=>{
      let v=el.value;
      if(el.dataset.num==="1") v = v===""?null:Number(v);
      setP(el.dataset.path, v);
    });
  });
  const trend=$("#trendInput");
  if(trend) trend.addEventListener("input",()=>{ DB.adoptionTrend=trend.value.split(",").map(x=>Number(x.trim())).filter(x=>!isNaN(x)); });
}

/* ============================================================
   ACTIONS
   ============================================================ */
window.selectTeam=function(id){ activeTeam=id; if(!editing){ renderTop(); renderTeamProfile(); renderPage(); } 
  $("#teamSel").value=id||"all"; };
window.delRow=function(listPath,i){ getP(listPath).splice(i,1); renderEditPage(page); };
window.addRow=function(listPath,tpl){ getP(listPath).push(clone(tpl)); renderEditPage(page); };

function renderPage(){
  if(editing){ renderEditPage(page); return; }
  if(page==="overview") renderOverview();
  if(page==="technology") renderTechnology();
  if(page==="process") renderProcess();
  if(page==="people") renderPeople();
  requestAnimationFrame(()=>setTimeout(animate,70));
}
function renderAll(){ renderTop(); renderLadder(); renderMeters(); renderTeamProfile(); renderPage(); renderFooter();
  requestAnimationFrame(()=>setTimeout(animate,90)); }

function animate(){
  document.querySelectorAll(".mfill[data-w]").forEach(e=>e.style.width=e.dataset.w+"%");
  document.querySelectorAll(".bf[data-w]").forEach(e=>e.style.width=e.dataset.w+"%");
  document.querySelectorAll(".bar[data-h]").forEach(e=>e.style.height=e.dataset.h+"%");
  document.querySelectorAll(".lbr .mb i[data-w]").forEach(e=>e.style.width=e.dataset.w+"%");
}

function setPage(p){
  page=p;
  document.querySelectorAll(".navitem").forEach(n=>n.setAttribute("aria-current", n.dataset.page===p?"true":"false"));
  document.querySelectorAll(".page").forEach(pg=>pg.classList.remove("active"));
  $("#page-"+p).classList.add("active");
  renderPage();
  $("#side").classList.remove("open");
  window.scrollTo({top:0});
}

function enterEdit(){
  editing=true; snapshot=clone(DB); activeTeam=null; $("#teamSel").value="all";
  $("#editBtn").textContent="Editing…"; $("#editBtn").disabled=true;
  renderTop(); renderTeamProfile(); renderMeters(); renderLadder();
  renderEditPage(page);
  if(!$("#editbar")){
    const bar=document.createElement("div"); bar.className="editbar"; bar.id="editbar";
    bar.innerHTML=`<span class="msg">Editing data. Save to apply your changes to the dashboard.</span>
      <button class="btn danger" id="resetBtn">Reset to sample</button>
      <button class="btn" id="cancelBtn">Cancel</button>
      <button class="btn primary" id="saveBtn">Save changes</button>`;
    $(".main").appendChild(bar);
    $("#saveBtn").onclick=saveEdit; $("#cancelBtn").onclick=cancelEdit; $("#resetBtn").onclick=resetData;
  }
}
function exitEdit(){
  editing=false; $("#editBtn").textContent="Edit data"; $("#editBtn").disabled=false;
  const bar=$("#editbar"); if(bar) bar.remove();
  renderAll();
}
function saveEdit(){ const ok=saveLS(DB); exitEdit();
  toast(ok?"Saved to this browser.":"Saved for this session. Use “Download with data” to keep it permanently."); }
function cancelEdit(){ DB=snapshot; exitEdit(); }
function resetData(){ if(confirm("Replace all data with the original sample set?")){ DB=clone(DEFAULT_DATA); saveLS(DB);
  if(editing) renderEditPage(page); else renderAll(); toast("Reset to sample data."); } }

function renderFooter(){
  $("#footer").innerHTML=`<b>Illustrative data.</b> Use <b>Edit data</b> to replace the numbers with your own — the dashboard redraws from what you enter. Edits save ${STORAGE_OK?"to this browser automatically":"for the current session"}; <b>Download with data</b> bakes them into a standalone <span class="mono">index.html</span> you can publish to GitHub Pages. <b>Confidentiality:</b> a public page exposes its data to anyone with the link, so keep real figures on a private or SSO-gated host.`;
}

/* export / import / bake */
function download(name,content,type){
  const blob=new Blob([content],{type}); const url=URL.createObjectURL(blob);
  const a=document.createElement("a"); a.href=url; a.download=name; a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function exportJSON(){ download("ai-transformation-data.json", JSON.stringify(DB,null,2), "application/json"); }
function importJSON(file){ const r=new FileReader();
  r.onload=()=>{ try{ const d=JSON.parse(r.result); DB=d; saveLS(DB); if(editing){cancelEdit();} renderAll(); toast("Data imported."); }
    catch(e){ toast("That file isn’t valid JSON."); } };
  r.readAsText(file); }
function bakeHTML(){
  const b64=btoa(unescape(encodeURIComponent(JSON.stringify(DB))));
  let html=ORIGINAL_HTML.replace(/<script>window\.__SEED__=[^]*?<\/script>\s*/,"");
  const seed=`<script>window.__SEED__=${JSON.stringify(b64)};<\/script>\n`;
  html=html.replace("</head>", seed+"</head>");
  download("index.html", html, "text/html");
  toast("Downloaded index.html with your data baked in.");
}

/* tiny toast */
let toastTimer;
function toast(msg){
  let t=$("#toast"); if(!t){ t=document.createElement("div"); t.id="toast";
    t.style.cssText="position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;"+
      "padding:10px 16px;border-radius:10px;font-size:13px;z-index:100;box-shadow:var(--shadow);max-width:90vw;text-align:center";
    document.body.appendChild(t); }
  t.textContent=msg; t.style.opacity="1";
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.style.opacity="0",2600);
}

/* ============================================================
   INIT
   ============================================================ */
function initTeamSelect(){
  const sel=$("#teamSel");
  sel.innerHTML=`<option value="all">All teams</option>`+DB.teams.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join("");
  sel.value=activeTeam||"all";
  sel.onchange=()=>selectTeam(sel.value==="all"?null:sel.value);
}
document.querySelectorAll(".navitem").forEach(n=>n.onclick=()=>setPage(n.dataset.page));
$("#editBtn").onclick=enterEdit;
$("#exportBtn").onclick=exportJSON;
$("#importBtn").onclick=()=>$("#importFile").click();
$("#importFile").onchange=e=>{ if(e.target.files[0]) importJSON(e.target.files[0]); e.target.value=""; };
$("#bakeBtn").onclick=bakeHTML;
$("#menuToggle").onclick=()=>$("#side").classList.toggle("open");

initTeamSelect();
renderAll();
</script>
</body>
</html>
